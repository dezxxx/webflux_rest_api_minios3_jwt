plugins {
	id 'java'
	id 'org.springframework.boot' version "$springBootVersion"
	id 'io.spring.dependency-management' version "$springDependencyManagementVersion"
}

group = 'com.dezxxx'
version = '1.0.0-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

// Integration tests get their own source tree, not just their own name. Sharing one with
// `test` made the IDE offer every unit test to both tasks, and the one that did not own
// the name failed the whole build.
sourceSets {
	integrationTest {
		java.srcDir 'src/integrationTest/java'
		resources.srcDir 'src/integrationTest/resources'
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}
}

// Everything `test` may use, `integrationTest` may use too — Testcontainers included
configurations {
	integrationTestImplementation.extendsFrom testImplementation
	integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
	integrationTestCompileOnly.extendsFrom testCompileOnly
	integrationTestAnnotationProcessor.extendsFrom testAnnotationProcessor
}

dependencies {
	// --- Web / reactive core ---
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-security'

	// --- Persistence: R2DBC at runtime, Flyway migrates over JDBC ---
	implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'io.asyncer:r2dbc-mysql'
	implementation 'org.flywaydb:flyway-mysql'
	runtimeOnly 'com.mysql:mysql-connector-j'

	// --- S3 object storage (MinIO-compatible, async client) ---
	// The BOM fixes the versions of every awssdk module below it
	implementation platform("software.amazon.awssdk:bom:$awssdkVersion")
	implementation 'software.amazon.awssdk:s3'
	implementation 'software.amazon.awssdk:netty-nio-client'

	// --- OpenAPI / Swagger UI (webflux flavour, not webmvc) ---
	implementation "org.springdoc:springdoc-openapi-starter-webflux-ui:$springdocVersion"

	// --- JWT ---
	implementation "io.jsonwebtoken:jjwt-api:$jjwtVersion"
	runtimeOnly "io.jsonwebtoken:jjwt-impl:$jjwtVersion"
	runtimeOnly "io.jsonwebtoken:jjwt-jackson:$jjwtVersion"

	// --- Lombok ---
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'

	// --- Test ---
	// Core starter: JUnit 5, Mockito, AssertJ. The technology-specific
	// starters below sit on top of it and do not replace it.
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation "org.testcontainers:junit-jupiter:$testcontainersVersion"
	testImplementation "org.testcontainers:mysql:$testcontainersVersion"
    testImplementation "org.testcontainers:r2dbc:$testcontainersVersion"
	testImplementation "org.testcontainers:minio:$testcontainersVersion"
	testImplementation 'org.springframework.boot:spring-boot-starter-webflux-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-r2dbc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'io.projectreactor:reactor-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Two prongs on purpose. `test` mocks everything and needs no Docker, so it can run on
// every save; `integrationTest` starts real containers and is deliberately kept out of it.
tasks.named('test') {
	useJUnitPlatform()
}

tasks.register('integrationTest', Test) {
	group = 'verification'
	description = 'Runs the *IT suites in src/integrationTest against real MySQL and MinIO'

	useJUnitPlatform()

	testClassesDirs = sourceSets.integrationTest.output.classesDirs
	classpath = sourceSets.integrationTest.runtimeClasspath

	// A stale IDE run configuration can still address this task by a unit test's name.
	// Shrug at it rather than failing the build the other task is about to pass.
	filter { failOnNoMatchingTests = false }

	shouldRunAfter tasks.named('test')
}
