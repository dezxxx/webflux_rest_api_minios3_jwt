spring:
  application:
    name: minios3

  # Runtime access is reactive: r2dbc:mysql, not jdbc:mysql
  r2dbc:
    url: r2dbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:minios3}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    pool:
      enabled: true
      initial-size: 5
      max-size: 20

  # Flyway has no reactive driver: migrations run over blocking JDBC on purpose
  flyway:
    enabled: true
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:minios3}?createDatabaseIfNotExist=true
    user: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    # Dev-only default. Override JWT_SECRET in every real environment.
    # HS256 requires at least 256 bits of key material.
    secret: ${JWT_SECRET:change-me-in-production-at-least-32-bytes-long}
    # A single access token, no refresh flow: on expiry the client logs in again.
    # A day is long enough to keep Swagger usable; production would use minutes.
    access-token-ttl: 24h
    issuer: minios3

  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    bucket: ${S3_BUCKET:files}
    # MinIO addresses buckets by path, not by virtual host as real S3 does
    path-style-access: true

logging:
  level:
    org.springframework.r2dbc: DEBUG
    org.flywaydb: INFO
