spring:
  application:
    name: minios3

  # Runtime access is reactive: r2dbc:mysql, not jdbc:mysql
  r2dbc:
    url: r2dbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:minios3}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    pool:
      enabled: true
      initial-size: 5
      max-size: 20

  # Flyway has no reactive driver: migrations run over blocking JDBC on purpose
  flyway:
    enabled: true
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:minios3}?createDatabaseIfNotExist=true
    user: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    # Dev-only default. Override JWT_SECRET in every real environment.
    # HS256 requires at least 256 bits of key material.
    secret: ${JWT_SECRET:change-me-in-production-at-least-32-bytes-long}
    # Two tokens, neither stored: the access token is short so that a changed role
    # or a blocked user takes effect quickly, the refresh token is how the client
    # gets a new one without asking for the password again.
    # Raise the access TTL locally if re-authorising Swagger every 15 minutes annoys.
    access-token-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TTL:30d}
    issuer: minios3

  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    bucket: ${S3_BUCKET:files}
    # MinIO addresses buckets by path, not by virtual host as real S3 does
    path-style-access: true

# Off by default: the generated document lists every path, every field and the role
# each endpoint needs. The dev profile turns it back on, where SecurityConfig also
# makes the paths public.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

logging:
  level:
    org.springframework.r2dbc: DEBUG
    org.flywaydb: INFO
