services:
  mysql:
    image: mysql:8.4
    container_name: minios3-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: minios3
    ports:
      # Host 3307 -> container 3306: a local MySQL service already holds 3306
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: minios3-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot job: creates the bucket, then exits. Without it the first
  # upload fails with NoSuchBucket — MinIO does not autocreate buckets.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/files &&
      echo 'bucket ready'
      "

  # The application itself. Kept in a profile so `docker compose up` still brings up just
  # the infrastructure for running the app from the IDE, which is the usual case.
  # Start everything with: docker compose --profile app up --build
  app:
    build: .
    container_name: minios3-app
    profiles: ["app"]
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      # Service names, not localhost: inside the network each container is its own host
      DB_HOST: mysql
      DB_PORT: 3306
      S3_ENDPOINT: http://minio:9000
      # Development credentials are only allowed to stay in place under this profile;
      # InsecureDefaultsGuard refuses to start without it. Never set it anywhere real.
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8080:8080"

volumes:
  mysql-data:
  minio-data: